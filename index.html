
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Durai AI Assistant</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 760px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px #17203312;
    }

    #chat {
      min-height: 280px;
      max-height: 440px;
      overflow-y: auto;
      padding: 12px 0;
    }

    .message {
      padding: 12px 15px;
      border-radius: 12px;
      margin: 10px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .assistant { background: #eef2ff; }
    .user { background: #e4f8eb; margin-left: 35px; }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #ccd2df;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #405cf5;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .note {
      color: #626c80;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      main { margin: 12px auto; padding: 12px; }
      .card { padding: 16px; }
      .controls { flex-direction: column; }
      .user { margin-left: 15px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Durai AI Assistant</h1>
    <p>Ask questions about your knowledge base</p>
  </header>

  <main>
    <section class="card">
      <h2>Chat with your AI</h2>
      <div id="chat" aria-live="polite">
        <div class="message assistant">
          Hello! I'm Durai AI Assistant. Ask me a question to get started.
        </div>
      </div>

      <form id="chat-form">
        <div class="controls">
          <input id="question" type="text"
            placeholder="Ask your question..."
            aria-label="Your question" required>
          <button id="send" type="submit">Send</button>
        </div>
      </form>

      <p class="note" id="status">
        Website interface preview. The AI service has not been connected yet.
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");
    const status = document.getElementById("status");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");
      input.value = "";

      addMessage(
        "The website interface is ready, but the online AI backend has not been connected yet.",
        "assistant"
      );

      status.textContent =
        "Preview only. We'll connect the real RAG backend in the next steps.";
    });
  </script>
</body>
</html>
